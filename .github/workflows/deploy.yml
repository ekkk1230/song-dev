name: Deploy Next.js Portfolio

# main 브랜치에 push(또는 merge)될 때 자동 실행
on:
  push:
    branches: [ "main" ] # 본인의 기본 브랜치가 master라면 master로 변경

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 레포지토리 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 사용하는 Node 버전
          cache: 'npm'

      # 3. 의존성 패키지 설치
      - name: Install Dependencies
        run: npm install 

      # 4. Next.js 프로젝트 빌드
      - name: Build Project
        run: npm run build 